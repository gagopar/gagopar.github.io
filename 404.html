<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>여행고파</title>
<style>
  :root { --bg:#ffffff; --fg:#1f2933; --sub:#616e7c; --accent:#1a73e8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12161c; --fg:#e4e7eb; --sub:#9aa5b1; --accent:#8ab4f8; } }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--fg); font-family:-apple-system,"Noto Sans KR",sans-serif; }
  main { max-width:420px; padding:24px; text-align:center; }
  h1 { font-size:1.5rem; margin:0 0 12px; }
  p { color:var(--sub); line-height:1.6; margin:0 0 24px; }
  a.btn { display:inline-block; padding:12px 24px; border-radius:8px; background:var(--accent);
          color:#fff; text-decoration:none; font-weight:600; }
</style>
</head>
<body>
<main>
  <h1>여행고파</h1>
  <p>공유된 링크는 여행고파 앱에서 열 수 있어요.<br>앱이 설치되어 있지 않다면 설치 후 링크를 다시 눌러주세요.</p>
  <a class="btn" href="https://play.google.com/store/apps/details?id=kr.co.citus.tm">Google Play에서 앱 설치하기</a>
</main>
</body>
</html>
